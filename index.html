<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharflow Education — Abacus</title>
<style>
:root{--w1:#7a4a28;--w2:#4e2c14;--bed:#e9d3ab;--ink:#111827;--spd:.15s}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#faf7f2;color:var(--ink);font-family:'Segoe UI',Tahoma,'Noto Sans Bengali',sans-serif;touch-action:manipulation}
h1{margin:0;font-size:clamp(16px,4.5vw,24px);letter-spacing:1px}
h2{margin:2px 0 0;font-size:clamp(10px,2.8vw,13px);color:#374151;font-weight:600}
button,select,input{font:inherit}
button{min-height:36px;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px;cursor:pointer}
button.on{background:#b45309}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
select,input[type=text]{min-height:36px;border:2px solid var(--ink);border-radius:6px;padding:2px 6px;background:#fff;max-width:100%;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.msg{font-weight:700;font-size:12px;min-height:16px}
.err{color:#dc2626}.ok{color:#16a34a}
/* ---------- one-screen layout ---------- */
.page{height:100dvh;max-width:1250px;margin:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.top{flex:none;display:flex;justify-content:space-between;align-items:center;position:relative}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.left{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.right{flex:none}
@media(min-width:900px){.main{flex-direction:row;gap:12px}.left{flex:1 1 36%}.right{flex:1 1 64%;overflow:auto}}
.panel{background:#f3f4f6;border:2px solid var(--ink);border-radius:10px;padding:8px}
.practice select{flex:1 1 90px}
.practice #bGen{flex:1 1 100%}
@media(min-width:420px){.practice #bGen{flex:1 1 auto}}
/* gear */
#bGear{width:40px;font-size:20px;padding:0}
#gearPanel{position:absolute;right:0;top:44px;z-index:50;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:210px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#gearPanel label{font-size:13px}
/* abacus */
#abacus{zoom:var(--z,1)}
.frame{background:linear-gradient(180deg,var(--w1),var(--w2));border-radius:10px;padding:8px;border:3px solid #3a2210;box-shadow:0 8px 18px rgba(0,0,0,.22)}
.bed{background:var(--bed);border-radius:4px;padding:4px;overflow-x:auto;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.rods{position:relative;display:flex;justify-content:center;height:282px}
.rods::before{content:"";position:absolute;left:0;right:0;top:64px;height:12px;z-index:3;background:linear-gradient(#4e2c14,#2c1608);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.rod{position:relative;flex:1 0 20px;max-width:48px;height:282px;cursor:pointer;border-radius:5px;transition:opacity .2s}
.rod.sel{box-shadow:0 0 0 3px #16a34a}
.focus .rod:not(.sel){opacity:.22}
.line{position:absolute;left:50%;top:2px;bottom:34px;width:4px;margin-left:-2px;background:linear-gradient(90deg,#1a0f08,#4a2c14,#1a0f08);border-radius:2px;z-index:1}
.dot{position:absolute;left:50%;top:66.5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#e9c27a;z-index:4;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.4)}
.dot::after{content:"";position:absolute;inset:-12px}
.dot.unit{background:#16a34a;box-shadow:0 0 0 2px #fff,0 0 0 4px #16a34a}
.bead{position:absolute;left:50%;width:min(40px,94%);height:22px;transform:translateX(-50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:top var(--spd) ease;z-index:5;cursor:pointer}
.bead.h{background:radial-gradient(circle at 35% 30%,#a85a3f,#6e2f1c 75%)}
.bead.e{background:radial-gradient(circle at 35% 30%,#e0b273,#a8763c 75%)}
.dg,.pv{position:absolute;left:0;right:0;text-align:center;font-family:Consolas,monospace;font-weight:800;color:#3a2210;display:none}
.dg{bottom:14px;font-size:14px}.pv{bottom:0;font-size:9px}
.showv .dg{display:block}.showpv .pv{display:block}
.mini{margin-top:6px}
.mini input{width:110px}
#val{font:800 16px Consolas,monospace;letter-spacing:1px;word-break:break-all}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin-top:6px;font-size:11px;color:#374151}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-2px}
@media(max-width:768px){.hidemob,.legend{display:none!important}}
/* worksheet */
#shSec{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#sheet{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;align-content:start}
.sum{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px;font-family:Consolas,monospace}
.sum .n{display:grid;grid-template-columns:16px 1fr;font-size:16px;font-weight:700;text-align:right}
.sum hr{border:0;border-top:2px solid var(--ink);margin:3px 0}
.sum input{width:100%;font-size:16px}
.sum.good{border-color:#16a34a;background:#f0fdf4}.sum.bad{border-color:#dc2626;background:#fef2f2}
.mk{font:700 12px 'Segoe UI',sans-serif;min-height:16px}
.qno{font:700 10px 'Segoe UI',sans-serif;color:#6b7280}
.hint{font-size:13px;color:#6b7280;padding:6px}
@media print{.noprint{display:none!important}html,body,.page,.main,.left,#shSec,#sheet{height:auto!important;overflow:visible!important;display:block}#sheet{display:grid}.sum{break-inside:avoid}}
</style>
</head>
<body>
<div class="page">
  <header class="top noprint">
    <div><h1>Sharflow Education</h1><h2>Abacus Parents Training Program</h2></div>
    <button id="bGear" aria-haspopup="true" aria-expanded="false" aria-label="Settings / সেটিংস">⚙</button>
    <div id="gearPanel" hidden role="group" aria-label="Settings">
      <button id="bSnd" aria-pressed="true" class="hidemob">🔊 Sound / শব্দ</button>
      <button id="bSlow" aria-pressed="false" class="hidemob">🐢 Slow / ধীর</button>
      <button id="bFocus" aria-pressed="false" class="hidemob">🔎 Focus / ফোকাস</button>
      <button id="bPV" aria-pressed="false">Place value / স্থানমান</button>
      <div class="row hidemob"><button id="bZo" aria-label="Zoom out">➖ Zoom</button><button id="bZi" aria-label="Zoom in">➕ Zoom</button></div>
      <label class="hidemob">Rods / রড <select id="rodSel"><option value="auto">Auto</option><option>13</option><option>17</option><option>21</option></select></label>
    </div>
  </header>

  <main class="main">
    <section class="left">
      <div class="panel practice noprint">
        <div class="row">
          <select id="pType" aria-label="Practice type"><option value="">1. Type / ধরন</option><option value="none">Without Complement</option><option value="five">5 Complement</option><option value="ten">10 Complement</option><option value="mix">Mix Complement</option></select>
          <select id="pDig" aria-label="Digits" disabled><option value="">2. Digits / অঙ্ক</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
          <select id="pRows" aria-label="Rows" disabled><option value="">3. Rows / সারি</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select>
          <select id="pCnt" aria-label="Sums" disabled><option value="10">4. Sums / হিসাব</option><option>5</option><option>10</option><option>15</option><option>20</option></select>
          <button id="bGen" disabled>Generate / তৈরি করুন</button>
        </div>
        <div class="msg" id="pMsg" role="status"></div>
      </div>
      <div id="hint" class="hint noprint">Pick options above and tap Generate. / উপরে অপশন বেছে "তৈরি করুন" চাপুন।</div>
      <div id="shSec" hidden>
        <div id="sheet"></div>
        <div class="row noprint">
          <button id="bChk">Check All / যাচাই</button>
          <button id="bTry">Try again / আবার</button>
          <button id="bNew">New / নতুন</button>
          <button id="bPrint">Print / PDF</button>
          <span class="msg" id="score" role="status"></span>
        </div>
      </div>
    </section>

    <section class="right noprint">
      <div id="abacus"><div class="frame"><div class="bed"><div class="rods" id="rods"></div></div></div></div>
      <div class="row mini">
        <input type="text" id="numIn" inputmode="decimal" placeholder="4205" aria-label="Number / সংখ্যা" maxlength="22">
        <button id="bSet">Set / সেট</button>
        <button id="bReset">Reset / রিসেট</button>
        <button id="bVal" aria-pressed="false">Value / মান</button>
        <span id="val" hidden>0</span>
      </div>
      <div class="msg" id="numMsg" role="status"></div>
      <div class="legend"><span><i style="background:#6b4423"></i>Frame / ফ্রেম</span><span><i style="background:#2c1608"></i>Bar / বার</span><span><i style="background:#6e2f1c"></i>Heaven = 5</span><span><i style="background:#a8763c"></i>Earth = 1</span><span><i style="background:#16a34a"></i>Unit rod / একক রড (tap dot)</span></div>
    </section>
  </main>
</div>

<script>
/* ================= CONSTANTS ================= */
const H_OFF=4,H_ON=42,E_ON=[78,98,118,138],E_OFF=[168,188,208,228];
const MOBILE_BP=768,MOBILE_ZOOM=.74;
const $=id=>document.getElementById(id);

/* ================= STATE ================= */
let N=17,unit=8,st=[],sel=null,soundOn=true,zoom=1,manual=false,sheetData=[],sheetCfg=null;
const isMob=()=>innerWidth<MOBILE_BP;
const autoN=()=>isMob()?13:17;
const defZoom=()=>isMob()?MOBILE_ZOOM:1;

/* ================= SOUND (lazy, after user gesture) ================= */
let ac=null;
function click(){
  if(!soundOn)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type='square';o.frequency.value=620;
    g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.09);
  }catch(e){}
}

/* ================= ABACUS ================= */
function setN(n){
  N=n;unit=(n-1)/2;sel=null;
  st=Array.from({length:n},()=>({h:0,e:0}));
  build();
}
function build(){
  const c=(N-1)/2;let h='';
  for(let r=0;r<N;r++){
    const dot=(((r-c)%3)+3)%3===0; // every 3rd rod, symmetric around centre rod
    h+=`<div class="rod${r===sel?' sel':''}" data-r="${r}"><i class="line"></i>`;
    if(dot)h+=`<b class="dot${r===unit?' unit':''}" role="button" aria-label="Set unit rod"></b>`;
    h+=`<span class="bead h" data-k="h"></span>`;
    for(let k=0;k<4;k++)h+=`<span class="bead e" data-k="${k}"></span>`;
    h+=`<em class="dg"></em><small class="pv"></small></div>`;
  }
  $('rods').innerHTML=h;draw();
}
function draw(){
  const rods=$('rods').children;
  for(let r=0;r<N;r++){
    const el=rods[r],s=st[r];
    el.querySelectorAll('.bead').forEach(b=>{
      const k=b.dataset.k;
      b.style.top=(k==='h'?(s.h?H_ON:H_OFF):(+k<s.e?E_ON[+k]:E_OFF[+k]))+'px';
    });
    el.querySelector('.dg').textContent=5*s.h+s.e;
    const p=unit-r;
    el.querySelector('.pv').innerHTML=p===0?'1':`10<sup>${p}</sup>`;
  }
  $('val').textContent=valueStr();
}
function valueStr(){
  const d=st.map(s=>5*s.h+s.e);
  const ip=d.slice(0,unit+1).join('').replace(/^0+(?=\d)/,'');
  const dp=d.slice(unit+1).join('').replace(/0+$/,'');
  return dp?ip+'.'+dp:ip;
}
function tap(r,k){
  const s=st[r];
  if(k==='h')s.h^=1;
  else{k=+k;s.e=k<s.e?k:k+1;} // moves tapped bead and all beads between it and the bar
  click();draw();
}
function setRod(r,d){st[r].h=d>=5?1:0;st[r].e=d%5}
function select(r){
  sel=r;
  document.querySelectorAll('.rod.sel').forEach(e=>e.classList.remove('sel'));
  const el=$('rods').children[r];if(el)el.classList.add('sel');
}
function resetAll(){st.forEach((s,i)=>setRod(i,0));draw()}

/* one delegated listener: no per-bead listeners, no leaks, no touch+click doubles */
$('rods').addEventListener('click',e=>{
  const rod=e.target.closest('.rod');if(!rod)return;
  const r=+rod.dataset.r;
  if(e.target.closest('.dot')){unit=r;select(r);build();return}
  select(r);
  const b=e.target.closest('.bead');
  if(b)tap(r,b.dataset.k);
});

/* ================= SETTINGS + SMALL CONTROLS ================= */
function toggle(btn,fn){btn.addEventListener('click',()=>{const on=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',on);btn.classList.toggle('on',on);fn(on)})}
const gear=$('bGear'),gp=$('gearPanel');
const closeGear=()=>{gp.hidden=true;gear.setAttribute('aria-expanded','false')};
gear.addEventListener('click',e=>{e.stopPropagation();const open=gp.hidden;gp.hidden=!open;gear.setAttribute('aria-expanded',open)});
document.addEventListener('click',e=>{if(!gp.hidden&&!gp.contains(e.target))closeGear()});

$('bReset').onclick=resetAll;
toggle($('bVal'),on=>{$('val').hidden=!on;$('rods').classList.toggle('showv',on)});
toggle($('bPV'),on=>$('rods').classList.toggle('showpv',on));
$('bSnd').classList.add('on');
$('bSnd').addEventListener('click',()=>{soundOn=!soundOn;$('bSnd').setAttribute('aria-pressed',soundOn);$('bSnd').classList.toggle('on',soundOn)});
toggle($('bSlow'),on=>document.documentElement.style.setProperty('--spd',on?'.6s':'.15s'));
toggle($('bFocus'),on=>{$('rods').classList.toggle('focus',on);if(on&&sel===null)select(unit)});
function setZoom(z){zoom=Math.max(.5,Math.min(1.6,+z.toFixed(2)));$('abacus').style.setProperty('--z',zoom)}
$('bZi').onclick=()=>setZoom(zoom+.1);$('bZo').onclick=()=>setZoom(zoom-.1);
$('rodSel').onchange=e=>{manual=e.target.value!=='auto';setN(manual?+e.target.value:autoN())};
let rt;
function onResize(){clearTimeout(rt);rt=setTimeout(()=>{if(!manual&&autoN()!==N){setN(autoN());setZoom(defZoom())}},150)}
addEventListener('resize',onResize);addEventListener('orientationchange',onResize);

/* keyboard (ignored while typing in a field) */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeGear();return}
  if(/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    select(sel===null?unit:Math.max(0,Math.min(N-1,sel+(e.key==='ArrowLeft'?-1:1))));e.preventDefault();
  }else if(/^[0-9]$/.test(e.key)&&sel!==null){setRod(sel,+e.key);click();draw()}
  else if((e.key==='Backspace'||e.key==='Delete')&&sel!==null){setRod(sel,0);click();draw()}
  else if(e.key==='r'||e.key==='R')resetAll();
});

/* ================= NUMBER ENTRY (aligned to unit rod) ================= */
function say(el,t,ok){el.textContent=t;el.className='msg '+(ok?'ok':'err')}
$('bSet').onclick=()=>{
  const s=$('numIn').value.trim(),m=$('numMsg');
  if(!s)return say(m,'Enter a number / সংখ্যা লিখুন');
  if(s[0]==='-')return say(m,'Negative not allowed / ঋণাত্মক নয়');
  if(!/^\d+(\.\d+)?$/.test(s))return say(m,'Digits only, e.g. 4205 or 12.5 / শুধু অঙ্ক');
  const [ip0,dp='']=s.split('.'),ip=ip0.replace(/^0+(?=\d)/,'');
  if(ip.length>unit+1||dp.length>N-1-unit)return say(m,'Too big for this unit rod / এই একক রডে ধরবে না');
  st.forEach((x,i)=>setRod(i,0));
  for(let i=0;i<ip.length;i++)setRod(unit-(ip.length-1-i),+ip[i]);
  for(let j=0;j<dp.length;j++)setRod(unit+1+j,+dp[j]);
  click();draw();say(m,'✓ '+s,true);
};
$('numIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('bSet').click()});

/* ================= PRACTICE GENERATOR ================= */
/* classify one column step: d=direct, f=5-complement, t=10-complement (carry/borrow) */
function colOp(x,a,sub){
  const e=x%5;
  if(!sub){
    if(x+a>9)return 't';
    return(a<5?e+a<=4:(x<5&&e+a-5<=4))?'d':'f';
  }
  if(x<a)return 't';
  return(a<5?e>=a:(x>=5&&e>=a-5))?'d':'f';
}
const pad=(n,l)=>String(n).padStart(l,'0').split('').map(Number);
function genSum(type,d,rows){
  const lo=d===1?1:10**(d-1),hi=10**d-1;let last=null;
  for(let t=0;t<400;t++){
    let tot=0,list=[],kinds=new Set(),ok=true;
    for(let i=0;i<rows&&ok;i++){
      let placed=false;
      for(let a=0;a<80&&!placed;a++){
        const n=lo+Math.floor(Math.random()*(hi-lo+1));
        const sub=i>0&&Math.random()<.5;
        if(sub&&n>tot)continue; // never negative
        const len=String(tot+n).length+1,X=pad(tot,len),A=pad(n,len),ks=new Set();
        for(let j=0;j<len;j++)if(A[j]!==0)ks.add(colOp(X[j],A[j],sub));
        if(type==='none'&&(ks.has('f')||ks.has('t')))continue;
        if(type==='five'&&ks.has('t'))continue;
        list.push({s:sub?-1:1,n});ks.forEach(k=>kinds.add(k));tot+=sub?-n:n;placed=true;
      }
      if(!placed)ok=false;
    }
    if(!ok)continue;
    last={rows:list,ans:tot};
    if(type==='five'&&!kinds.has('f'))continue;
    if(type==='ten'&&!kinds.has('t'))continue;
    if(type==='mix'&&rows>2&&!(kinds.has('f')||kinds.has('t')))continue;
    return last;
  }
  return last;
}
function generate(){
  const type=$('pType').value,d=+$('pDig').value,rows=+$('pRows').value,cnt=+$('pCnt').value||10;
  sheetCfg={type,d,rows,cnt};sheetData=[];const seen=new Set();
  for(let i=0;i<cnt;i++){
    let g=null;
    for(let t=0;t<60;t++){g=genSum(type,d,rows);if(!g)continue;const k=g.rows.map(r=>r.s*r.n).join(',');if(!seen.has(k)){seen.add(k);break}}
    if(g)sheetData.push(g);
  }
  renderSheet();
  say($('pMsg'),sheetData.length<cnt?'Only '+sheetData.length+' unique sums possible / কম হিসাব তৈরি হয়েছে':'',false);
}
function renderSheet(){
  $('shSec').hidden=false;$('hint').hidden=true;$('score').textContent='';
  $('sheet').innerHTML=sheetData.map((g,i)=>`<div class="sum" id="s${i}"><div class="qno">#${i+1}</div>`+
    g.rows.map((r,j)=>`<div class="n"><span>${j?(r.s>0?'+':'−'):''}</span><span>${r.n}</span></div>`).join('')+
    `<hr><input type="text" inputmode="numeric" aria-label="Answer ${i+1}" id="a${i}"><div class="mk" id="m${i}"></div></div>`).join('');
}
function checkAll(){ // recomputed from scratch each press, so no double counting
  let good=0;
  sheetData.forEach((g,i)=>{
    const v=$('a'+i).value.trim(),ok=/^\d+$/.test(v)&&Number(v)===g.ans;
    if(ok)good++;
    $('s'+i).className='sum '+(ok?'good':'bad');
    $('m'+i).innerHTML=ok?'<span class="ok">✔ Correct</span>':`<span class="err">✘ Answer: ${g.ans}</span>`;
  });
  $('score').className='msg ok';$('score').textContent=`Score / স্কোর: ${good}/${sheetData.length}`;
}
function tryAgain(){sheetData.forEach((g,i)=>{$('a'+i).value='';$('s'+i).className='sum';$('m'+i).textContent=''});$('score').textContent=''}
['pType','pDig','pRows'].forEach((id,i,a)=>$(id).addEventListener('change',()=>{
  if(i<2){const nx=$(a[i+1]);nx.disabled=!$(id).value;if(!$(id).value){nx.value='';$('pRows').disabled=true}}
  const ready=$('pType').value&&$('pDig').value&&$('pRows').value;
  $('pCnt').disabled=!ready;$('bGen').disabled=!ready;
}));
$('bGen').onclick=generate;$('bNew').onclick=()=>{if(sheetCfg)generate()};
$('bChk').onclick=checkAll;$('bTry').onclick=tryAgain;$('bPrint').onclick=()=>print();

/* ================= INIT ================= */
setN(autoN());setZoom(defZoom());
</script>
</body>
</html>
